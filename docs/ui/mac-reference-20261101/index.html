3", "raster": null}, {"key": "302f0e6037919f8bc3a8", "class": "NSTextField", "text": "读音（可留空）", "width": 652, "height": 23, "font": "STYuanti-SC-Regular", "fontSize": 13, "vector": null, "raster": "a85851c96feecf6c2050"}, {"key": "ef69cb95cb8f1aec9f28", "class": "NSTextField", "text": "最近台词", "width": 144, "height": 38, "font": "STYuanti-SC-Bold", "fontSize": 27, "vector": "024efa5cc3914bd5ed37", "raster": null}, {"key": "adc7d39cc56d070877d7", "class": "NSTextField", "text": "关闭时自动识别整画面；开启后实时翻译和当前界面只读框内。这不是视频画面校准。", "width": 474, "height": 17, "font": "STYuanti-SC-Regular", "fontSize": 12, "vector": "7424e81c760568c640cf", "raster": null}, {"key": "f5b4f325272c0fc73b80", "class": "NSTextField", "text": "即使擅长画画，不每天练习也不会进步。", "width": 376, "height": 20, "font": "STYuanti-SC-Regular", "fontSize": 14, "vector": "750c56944443b628a0ef", "raster": null}, {"key": "14e9bf5daec8f8aff302", "class": "NSTextField", "text": "识别与画面来源", "width": 474, "height": 24, "font": "STYuanti-SC-Bold", "fontSize": 17, "vector": "0a10dfbebced5147c5bf", "raster": null}, {"key": "2586bf1de25d29f0431d", "class": "NSTextField", "text": "点击选词，或按住拖拽选择词语／短语", "width": 654, "height": 16, "font": "STYuanti-SC-Regular", "fontSize": 11, "vector": "554474ec5fa67cee841a", "raster": null}, {"key": "40fc428035a114cec922", "class": "NSTextField", "text": "贴译位置", "width": 754, "height": 18, "font": "STYuanti-SC-Regular", "fontSize": 13, "vector": "ca88a54ef69aa45b9540", "raster": null}, {"key": "cbf033e810108f4984b1", "class": "NSTextField", "text": "本次解析未返回整句结构，可在主界面重新分析。", "width": 404, "height": 17, "font": "STYuanti-SC-Regular", "fontSize": 12, "vector": "2ffb77e0cfa0e82d0981", "raster": null}, {"key": "543b10a781f9734654f0", "class": "FYWorkspaceButton", "text": "〜ないと", "width": 196, "height": 34, "font": "HiraMaruProN-W4", "fontSize": 12, "vector": "140e6cd68a109a2023a0", "raster": null}, {"key": "2ef28f56bf771f11ac98", "class": "FYWorkspaceButton", "text": "发送中…", "width": 70, "height": 34, "font": "STYuanti-SC-Regular", "fontSize": 11, "vector": "0391995e60239013920b", "raster": null}, {"key": "495d77a2c1bbccc9b8a7", "class": "NSTextField", "text": "正在测试服务", "width": 646, "height": 18, "font": "STYuanti-SC-Bold", "fontSize": 13, "vector": "1bf3ba3f319009387b06", "raster": null}, {"key": "67b6844b498e4a71897c", "class": "NSTextField", "text": "練習", "width": 36, "height": 22, "font": "STYuanti-SC-Bold", "fontSize": 16, "vector": "bbd9530f6acb043b62af", "raster": null}, {"key": "ded98d1e427fb1ecdda6", "class": "NSTextField", "text": "语法解释与等级供学习参考；分析与追问按需生成。", "width": 654, "height": 17, "font": "STYuanti-SC-Regular", "fontSize": 12, "vector": "d2300a77648cf4ae29c1", "raster": null}, {"key": "98ae5940bc2af1c81421", "class": "NSTextField", "text": "本句用法", "width": 504, "height": 17, "font": "STYuanti-SC-Regular", "fontSize": 12, "vector": "105b8dae9e7d44346773", "raster": null}, {"key": "7d22a7a95e7b8f5820ae", "class": "NSTextField", "text": "这个窗口既是识别画面的来源，也是字幕和贴译跟随的位置；换窗口会重新识别。", "width": 474, "height": 17, "font": "STYuanti-SC-Regular", "fontSize": 12, "vector": "84a590a6fef2c1d00888", "raster": null}, {"key": "0881b88cf245812a28ca", "class": "NSTextField", "text": "如果不每天练习就不会进步。明天也一起学习吧。这里使用合成内容，展示长卡的换行与滚动阅读。", "width": 324, "height": 98, "font": "STYuanti-SC-Regular", "fontSize": 19, "vector": "1f1047a6184f7e1926b8", "raster": null}, {"key": "6c76447655c9adc581a1", "class": "NSTextField", "text": "通过多模型平台使用模型时，请填写平台提供的 API Key。", "width": 782, "height": 17, "font": "STYuanti-SC-Regular", "fontSize": 12, "vector": "eef9e3dafdb66f267c2e", "raster": null}, {"key": "71dec9ce046b5080f3e3", "class": "NSTextField", "text": "画面来源", "width": 474, "height": 21, "font": "STYuanti-SC-Bold", "fontSize": 15, "vector": "5b56e689e942c5ed75fd", "raster": null}, {"key": "c740ff07320eb977fe99", "class": "NSTextField", "text": "本句用法", "width": 344, "height": 17, "font": "STYuanti-SC-Regular", "fontSize": 12, "vector": "577445f50f33e695b747", "raster": null}, {"key": "b9e5d71c3b9f84b
